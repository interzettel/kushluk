name: Native Project metadata

# Runs for every new issue. Manual dispatch handles first-time field creation
# and the one-time existing-issue backfill. Requires a scoped org Project token.
on:
  # Resume a small amount of remaining historical metadata work every two
  # hours; skip automatically when the owner's token budget is low.
  schedule:
    - cron: "37 */2 * * *"
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap fields/labels, audit coverage, or backfill all issues
        type: choice
        required: true
        options: [bootstrap, audit, backfill]
      batch_size:
        description: Maximum issues per backfill run (1–20)
        type: number
        default: 5

permissions:
  contents: read
  issues: write

concurrency:
  group: kushluk-project-metadata
  cancel-in-progress: false

jobs:
  issue-sync:
    name: Populate native fields for issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize metadata in Project #3
        env:
          GH_TOKEN: ${{ secrets.KUSHLUK_PROJECT_TOKEN }}
        shell: bash
        run: |
          remaining=$(gh api rate_limit --jq '.resources.graphql.remaining')
          if ! [[ "$remaining" =~ ^[0-9]+$ ]] || [ "$remaining" -lt 75 ]; then
            echo "::warning::Project GraphQL budget low; deferring this issue to the scheduled reconciliation."
            exit 0
          fi
          python tools/project_sync.py sync --event-file "$GITHUB_EVENT_PATH"

  maintenance:
    name: Project field setup or coverage audit
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap or inspect Project #3
        env:
          GH_TOKEN: ${{ secrets.KUSHLUK_PROJECT_TOKEN }}
          MODE: ${{ inputs.mode }}
          BATCH_SIZE: ${{ inputs.batch_size || 5 }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Project token secret KUSHLUK_PROJECT_TOKEN is not configured."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            remaining=$(gh api rate_limit --jq '.resources.graphql.remaining')
            if ! [[ "$remaining" =~ ^[0-9]+$ ]] || [ "$remaining" -lt 250 ]; then
              echo "GraphQL API budget low; preserving quota and retrying on the next schedule."
              exit 0
            fi
            python tools/project_sync.py backfill --batch-size 5
          else
            python tools/project_sync.py "$MODE" --batch-size "$BATCH_SIZE"
          fi
