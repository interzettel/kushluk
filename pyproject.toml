[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kushluk"
version = "0.1.0"
description = "Local-first, print-first personal morning publication"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62,<70", "pypdf>=5,<7", "Pillow>=11,<13"]\nimages = ["Pillow>=11,<13"]
dev = ["pytest>=8,<9", "ruff>=0.7,<1", "Pillow>=11,<13"]

[project.scripts]
kushluk = "kushluk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kushluk"]

[tool.hatch.build]
include = [
  "src/kushluk/templates/*.html",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
