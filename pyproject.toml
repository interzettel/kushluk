[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kushluk"
version = "0.1.0"
description = "Local-first, print-first personal morning publication"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
pdf = ["weasyprint>=70,<71", "pypdf>=5,<7", "Pillow>=11,<13"]
images = ["Pillow>=11,<13"]
google = ["google-auth>=2.35,<3", "google-auth-oauthlib>=1.2,<2"]
dev = ["pytest>=8,<9", "ruff>=0.7,<1", "Pillow>=11,<13"]

[project.scripts]
kushluk = "kushluk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kushluk"]

# Package Python modules and template resources together. The previous
# global include restricted the source list to templates and could produce
# an unusable distribution despite a working editable checkout.
[tool.hatch.build.targets.sdist]
include = [
  "/src/kushluk/**",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/SECURITY.md",
  "/CHANGELOG.md",
  "/docs/PREVIEW_INSTALL.md",
  "/docs/RELEASE_PLAN.md",
  "/docs/DEPENDENCY_AUDIT.md",
  "/docs/ARCHIVE_COMPATIBILITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
