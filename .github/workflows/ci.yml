name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q
      - name: Walking-skeleton smoke test
        run: |
          kushluk doctor
          kushluk generate --date 2026-09-23 --no-pdf
          test -n "$(find output -name '*.html' -print -quit)"
          test -n "$(find archive -name 'metadata.json' -print -quit)"
