name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q
      - name: Hermetic CLI edition smoke (no network, CUPS or SMTP)
        run: python -m tools.offline_smoke

  package-linux:
    name: Installable wheel/sdist / Linux Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install PEP 517 isolated build tooling
        run: python -m pip install --upgrade build
      - name: Rebuild wheel/sdist twice and clean-install both
        run: python -m tools.release_check --artifact-dir output/m1-preview
      - name: Upload synthetic installer evidence (no tag or release)
        uses: actions/upload-artifact@v4
        with:
          name: kushluk-m1-linux-py${{ matrix.python }}
          path: output/m1-preview/
          retention-days: 14

  macos:
    name: macOS / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub's macos-15 is arm64; macos-15-intel is x86_64.
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install native PDF text rendering dependencies
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf]"
      - name: Verify native PDF dependencies
        run: python -m weasyprint --info
      - run: ruff check src tests tools
      - run: pytest -q
      - name: Hermetic macOS CLI + PDF smoke (no network, CUPS or SMTP)
        run: python -m tools.offline_smoke --pdf
      - name: Generate three offline editorial archetype comparison PDFs
        run: python -m tools.layout_compare --output-dir output/layout-compare
      - name: Upload editorial archetype comparison kit
        uses: actions/upload-artifact@v4
        with:
          name: kushluk-layout-compare-${{ matrix.runner }}
          path: output/layout-compare/
          retention-days: 14
      - name: Generate rights-cleared local media print proof kit
        run: python -m tools.media_proof --output-dir output/media-proof
      - name: Upload rights-aware image proofs
        uses: actions/upload-artifact@v4
        with:
          name: kushluk-media-proof-${{ matrix.runner }}
          path: |
            output/media-proof/*.pdf
            output/media-proof/*.html
            output/media-proof/media-proof.json
          retention-days: 14
      - name: Verify offline A4/A3 print-proof CLI
        run: |
          kushluk print-proof --output-dir output/print-proof
          python -c 'import json; from pathlib import Path; from pypdf import PdfReader; p = Path("output/print-proof"); m=json.loads((p/"kushluk-proof.json").read_text()); assert not m["physical_verified"]; assert len(PdfReader(str(p/"kushluk-proof-a4.pdf")).pages)==4; assert len(PdfReader(str(p/"kushluk-proof-a3.pdf")).pages)==2'
      - name: Upload synthetic physical-print proof kit
        uses: actions/upload-artifact@v4
        with:
          name: kushluk-print-proof-${{ matrix.runner }}
          path: output/print-proof/
          retention-days: 14
      - name: Install PEP 517 isolated build tooling
        run: python -m pip install --upgrade build
      - name: Check clean wheel and sdist installs on macOS with four-page PDF
        run: python -m tools.release_check --pdf --artifact-dir output/m1-preview
      - name: Upload local installable preview candidate (unreleased)
        uses: actions/upload-artifact@v4
        with:
          name: kushluk-m1-${{ matrix.runner }}
          path: output/m1-preview/
          retention-days: 14
